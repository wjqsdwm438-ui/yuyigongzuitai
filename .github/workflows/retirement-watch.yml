name: Retirement watch
on:
  workflow_dispatch:
    inputs:
      write_issue:
        description: '已授权本次创建或更新唯一巡检 Issue'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: retirement-watch-main
  cancel-in-progress: false
jobs:
  scan:
    if: ${{ inputs.write_issue }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore memory, scan and deduplicate notification
        env:
          GH_TOKEN: ${{ github.token }}
          WORKBENCH_ISSUE_WRITE_APPROVED: ${{ inputs.write_issue }}
        run: python -X utf8 -B 脚本-scripts/退役巡检持续运行.py
      - name: Preserve project memory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retirement-state
          path: 临时-tmp/retirement-ci/workbench.sqlite3
          retention-days: 90
          if-no-files-found: error
      - name: Preserve review packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retirement-report
          path: 导出-exports/retirement-ci/report.json
          retention-days: 30
